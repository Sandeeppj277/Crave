services:
  # 1. Spring Boot 3 Backend Web Service
  - type: web
    name: crave-backend
    runtime: docker
    dockerfilePath: ./crave-backend/Dockerfile
    dockerContext: ./crave-backend
    plan: free
    region: oregon
    healthCheckPath: /api/restaurants
    envVars:
      - key: SPRING_DATASOURCE_URL
        placeholder: "jdbc:mysql://<host>:<port>/crave_db?useSSL=true&serverTimezone=UTC"
      - key: SPRING_DATASOURCE_USERNAME
        placeholder: "database_user"
      - key: SPRING_DATASOURCE_PASSWORD
        placeholder: "database_password"

  # 2. React (Vite) Frontend Static Site
  - type: web
    name: crave-frontend
    runtime: static
    rootDir: crave-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        placeholder: "https://crave-backend.onrender.com/api"
