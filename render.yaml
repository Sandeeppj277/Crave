services:
  # 1. Spring Boot 3 Backend Web Service
  - type: web
    name: crave-backend
    runtime: docker
    dockerfilePath: ./crave-backend/Dockerfile
    dockerContext: ./crave-backend
    plan: free
    region: oregon
    healthCheckPath: /api/restaurants
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: "jdbc:mysql://mysql-1a18b3e8-sandeeppj277-221c.j.aivencloud.com:16925/defaultdb?useSSL=true&serverTimezone=UTC"
      - key: SPRING_DATASOURCE_USERNAME
        value: "avnadmin"
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"

  # 2. React (Vite) Frontend Static Site
  - type: web
    name: crave-frontend
    runtime: static
    rootDir: crave-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://crave-backend.onrender.com/api"
